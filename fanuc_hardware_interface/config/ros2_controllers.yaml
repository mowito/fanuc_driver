controller_manager:
  ros__parameters:
    update_rate: 500 # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: fanuc_controllers/ScaledJointTrajectoryController
    fanuc_gpio_controller:
      type: fanuc_controllers/FanucGPIOController
    forward_position_controller:
      type: forward_command_controller/ForwardCommandController
    fanuc_force_sensor_broadcaster:
      type: fanuc_controllers/FanucForceSensorBroadcaster
    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster
    admittance_controller:
      type: admittance_controller/AdmittanceController


fanuc_gpio_controller:
  ros__parameters:
    gpio_config_file_package: fanuc_hardware_interface
    gpio_config_file_path: config/example_gpio_config.yaml

joint_trajectory_controller:
  ros__parameters:
    joints:
      - J1
      - J2
      - J3
      - J4
      - J5
      - J6
    command_joints:
      - admittance_controller/J1
      - admittance_controller/J2
      - admittance_controller/J3
      - admittance_controller/J4
      - admittance_controller/J5
      - admittance_controller/J6
    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false # Set to false to suppress deprecation warning
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      J1:
        goal: 0.05
        trajectory: 0.25
      J2:
        goal: 0.05
        trajectory: 0.25
      J3:
        goal: 0.05
        trajectory: 0.25
      J4:
        goal: 0.05
        trajectory: 0.25
      J5:
        goal: 0.05
        trajectory: 0.25
      J6:
        goal: 0.05
        trajectory: 0.25

forward_position_controller:
  ros__parameters:
    joints:
      - J1
      - J2
      - J3
      - J4
      - J5
      - J6
    interface_name: "position"

force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: "ft_sensor"
    frame_id: "fanuc_flange"


admittance_controller:
  ros__parameters:    
    joints:
      - J1
      - J2
      - J3
      - J4
      - J5
      - J6
    command_joints:
      - J1
      - J2
      - J3
      - J4
      - J5
      - J6
    command_interfaces:
      - position
    state_interfaces:
      - position
    chainable_command_interfaces:
      - position
    kinematics:
      plugin_name: kinematics_interface_kdl/KinematicsInterfaceKDL
      plugin_package: kinematics_interface
      base: base_link # Assumed to be stationary
      tip: fanuc_flange
      group_name: manipulator
      alpha: 0.05
    ft_sensor:
      name: ft_sensor
      frame:
        id: fanuc_flange # fanuc_flange Wrench measurements are in this frame
        external: false # force torque frame exists within URDF kinematic chain
      filter_coefficient: 0.02
    control:
      frame:
        id: fanuc_flange # Admittance calcs (displacement etc) are done in this frame. Usually the tool or end-effector
        external: false # control frame exists within URDF kinematic chain
    fixed_world_frame: # Gravity points down (neg. Z) in this frame (Usually: world or base_link)
      frame:
        id: base_link # Admittance calcs (displacement etc) are done in this frame. Usually the tool or end-effector
        external: false # control frame exists within URDF kinematic chain
    gravity_compensation:
      frame:
        id: fanuc_flange
        external: false
      CoG: # specifies the center of gravity of the end effector
        pos:
          - 0.0 #-0.0838 # x
          - 0.0 #-0.0076 # y
          - 0.0 #0.1212 # z
        force: 0.0 #3.63 # mass * 9.81
    admittance:
      selected_axes:
        - false # x
        - false # y
        - false # z
        - false # rx
        - false # ry
        - false # rz
      # Having ".0" at the end is MUST, otherwise there is a loading error
      # F = M*a + D*v + S*(x - x_d)
      mass:
        - 80.0
        - 80.0
        - 80.0
        - 0.8
        - 0.8
        - 0.8
      damping_ratio: # damping can be used instead: zeta = D / (2 * sqrt( M * S ))
        - 1.0 # x
        - 1.0 # y
        - 1.0 # z
        - 1.0 # rx
        - 1.0 # ry
        - 1.0 # rz
      stiffness:
        - 10.0
        - 10.0
        - 10.0
        - 5.0
        - 5.0
        - 5.0
      joint_damping: 50.0 # Damping applied in joint space to help stabilize the system
    # general settings
    enable_parameter_update_without_reactivation: true
